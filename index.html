<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playlist Sorter</title>
<style>
:root{--bg:#0e0f11;--card:#17191c;--line:#26292e;--fg:#f1f2f4;--mut:#8b919a;--g:#1ed760;--w:#ffb454;--r:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif;padding:16px 16px 90px}
main{max-width:720px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}
h1{font-size:20px;margin:0}h2{font-size:13px;color:var(--mut);margin:20px 4px 8px;font-weight:600}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:8px;z-index:5;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:11px;border-radius:10px;font:600 15px inherit;cursor:pointer}
.tabs button.on{background:var(--g);color:#06150b}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.tiles{display:flex;margin:0 -5px 8px}.tile{flex:1;margin:0 5px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
.tile b{display:block;font-size:26px}.tile span{color:var(--mut);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.sc{min-width:42px;text-align:center;border-radius:10px;padding:2px 10px;color:#000;font-weight:800}
.mut{color:var(--mut);font-size:13px}.rec{margin-top:8px;font-size:14px;line-height:1.55}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%}
.song{font-size:22px;font-weight:700;line-height:1.25}.art{color:var(--mut);margin:2px 0 12px}
iframe{border:0;width:100%;height:152px;border-radius:12px;background:#000}
.tags{margin:12px -4px}.chip{margin:4px;min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid #3a3f46;background:#1f2226;color:var(--fg);font:600 15px inherit;cursor:pointer}
.chip small{color:var(--mut);font-weight:400;margin-right:6px}.chip.on{background:var(--g);border-color:var(--g);color:#06150b}.chip.on small{color:#0b3a1c}
.chip.sm{min-height:34px;font-size:13px;padding:0 10px}
.act{display:flex}.btn{flex:1;margin:0 4px;min-height:54px;border-radius:14px;border:1.5px solid #3a3f46;background:#1f2226;color:var(--fg);font:700 17px inherit;cursor:pointer}
.btn.no{color:var(--r);border-color:var(--r)}.btn.yes{background:var(--g);border-color:var(--g);color:#06150b}.btn.sm{flex:none;min-height:40px;padding:0 14px;font-size:14px;margin:0}
.btn[disabled]{opacity:.35}
input,select,textarea{font:16px inherit;background:#1f2226;color:var(--fg);border:1.5px solid #3a3f46;border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{height:80px;direction:ltr;font-size:12px}.fl{display:flex;margin:8px 0}.fl>*+*{margin-right:8px}
details summary{color:var(--mut);cursor:pointer;padding:6px 0}code{background:#22262b;padding:3px 8px;border-radius:8px;direction:ltr;display:inline-block;word-break:break-all}
label{display:flex;align-items:center;color:var(--mut);font-size:14px;margin-top:8px}label input{width:20px;min-height:20px;margin-left:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);background:#fff;color:#000;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:90%;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--r);color:#fff}
</style></head><body><main><div id="app"></div></main><div id="toast"></div>
<script>
const LS=localStorage,$=s=>document.querySelector(s),TOK='https://accounts.spotify.com/api/token';
const J=(k,d)=>{try{return JSON.parse(LS[k]||d)}catch(e){return JSON.parse(d)}};
const S={tab:'ov',pls:[],main:[],W:{},info:{},cur:null,pick:false,only:true,busy:0,hist:[],dn:40,q:'',src:'',t0:0,rej:J('rej','{}'),skp:J('skp','{}'),G:{},A:{},kb:J('kb','{}'),aq:'',art:'',noLiked:''};
const save=()=>{LS.rej=JSON.stringify(S.rej);LS.skp=JSON.stringify(S.skp)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REDIR=location.origin+location.pathname,sleep=ms=>new Promise(z=>setTimeout(z,ms));
const b64=b=>btoa(String.fromCharCode.apply(null,new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let tt;function toast(m,e){const t=$('#toast');t.textContent=m;t.className='show'+(e?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2400)}
const msg=(t,btn)=>$('#app').innerHTML=`<div class="card">${esc(t)}${btn?'<p><button class="btn sm" onclick="reset()">התחבר מחדש</button></p>':''}<div class="mut" style="margin-top:8px">גרסה 5</div></div>`;
function reset(){LS.removeItem('tok');LS.removeItem('rt');location=REDIR}

/* ---------- auth ---------- */
async function tokReq(p){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),20000);let r;
  try{r=await fetch(TOK,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(p)})}
  catch(e){throw Error('אין תגובה משרת ההתחברות של ספוטיפיי')}finally{clearTimeout(to)}
  const j=await r.json();if(!j.access_token)throw Error(j.error_description||j.error||'auth');
  LS.tok=j.access_token;LS.exp=Date.now()+(j.expires_in-60)*1000;if(j.refresh_token)LS.rt=j.refresh_token;
}
async function ensure(){if(!LS.tok||Date.now()>+LS.exp){if(!LS.rt)throw Error('לא מחובר');await tokReq({client_id:LS.cid,grant_type:'refresh_token',refresh_token:LS.rt})}}
async function login(){
  LS.cid=$('#cid').value.trim();const v=b64(crypto.getRandomValues(new Uint8Array(48)));LS.ver=v;
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location=`https://accounts.spotify.com/authorize?`+new URLSearchParams({client_id:LS.cid,response_type:'code',redirect_uri:REDIR,
   scope:'playlist-read-private playlist-read-collaborative playlist-modify-private playlist-modify-public user-library-read',code_challenge_method:'S256',code_challenge:ch});
}
async function useCode(){
  try{const o=JSON.parse(atob($('#cc').value.trim()));LS.cid=o.c;LS.rt=o.r;LS.removeItem('tok');msg('מתחבר…');await load()}
  catch(e){msg('הקוד לא תקין: '+e.message,1)}
}
async function api(p,o={}){
  for(let k=0;;k++){
    await ensure();await gate();
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),30000);let r;
    try{r=await fetch(p.startsWith('http')?p:'https://api.spotify.com/v1'+p,{...o,signal:ac.signal,headers:{Authorization:'Bearer '+LS.tok,'Content-Type':'application/json'}})}
    catch(e){throw Error('אין תגובה מספוטיפיי, בדוק חיבור ונסה שוב')}finally{clearTimeout(to)}
    if(r.status==429){const w=(+r.headers.get('Retry-After')||2)+1;if(k>8)throw rl('ספוטיפיי עדיין מגבילה. ההתקדמות נשמרה, חכה כמה דקות ופתח שוב');setProg('ספוטיפיי מאטה · ממתין '+w+' שניות');if(w>90)throw rl('ספוטיפיי הגבילה זמנית את הבקשות. נסה שוב בעוד '+Math.ceil(w/60)+' דקות');await sleep(w*1000);continue}
    if(r.status==401&&k<2){LS.exp=0;continue}
    if(!r.ok)throw Error(r.status);
    return r.status==204?null:r.json();
  }
}
const idb=(m,k,v)=>new Promise(res=>{try{const o=indexedDB.open('sorter',1);o.onupgradeneeded=()=>o.result.createObjectStore('d');
  o.onsuccess=()=>{const st=o.result.transaction('d',m).objectStore('d'),r=m=='readwrite'?st.put(v,k):st.get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res()};o.onerror=()=>res()}catch(e){res()}});
let lastReq=0;async function gate(){const n=Date.now(),w=Math.max(0,lastReq+350-n);lastReq=n+w;if(w)await sleep(w)}
const rl=m=>{const e=Error(m);e.rl=1;return e};
const setProg=t=>{S.prog=t;const e=$('#prog');if(e)e.textContent=t};
async function pages(p,lb){const o=[];let u=p;while(u){const j=await api(u);o.push(...j.items);u=j.next;if(lb)setProg(lb+': '+o.length+(j.total?' / '+j.total:''))}return o}
const mapT=t=>({id:t.id,n:t.name,a:(t.artists||[]).map(a=>a.name).join(', '),ar:(t.artists||[]).map(a=>a.name),ai:(t.artists||[]).map(a=>a.id),y:+((t.album&&t.album.release_date)||'0').slice(0,4)});
let EP='items';
async function plTracks(id,lb){
  let it;try{it=await pages(`/playlists/${id}/${EP}?limit=100`,lb)}catch(e){if(!/^(400|404)$/.test(e.message))throw e;EP=EP=='items'?'tracks':'items';it=await pages(`/playlists/${id}/${EP}?limit=100`,lb)}
  return it.map(x=>x&&(x.item||x.track)).filter(t=>t&&t.id&&t.type!=='episode').map(mapT);
}

/* ---------- data ---------- */
async function load(quiet){
  if(S.loading)return;S.loading=1;S.noLiked='';S.prog='';
  const mk1=p=>({id:p.id,name:p.name,t:[],shz:/shazam/i.test(p.name)}),fin=o=>{o.s=new Set(o.t.map(x=>x.id));return o};
  if(!S.cache)S.cache=(await idb('readonly','c'))||{};const C=S.cache,sv=()=>idb('readwrite','c',C);
  try{
    if(!S.pls.length&&Object.keys(C).length){S.pls=Object.keys(C).map(id=>fin({id,name:C[id].name||'',t:C[id].t,shz:/shazam/i.test(C[id].name||''),liked:id=='liked'}));recalc();render();toast('מציג נתונים שמורים, מתעדכן ברקע')}
    if(S.pls.length)quiet=true;
    if(!quiet)msg('טוען פלייליסטים…');
    const all=(await pages('/me/playlists?limit=50')).filter(Boolean),reg=all.filter(p=>!/shazam/i.test(p.name)),shz=all.filter(p=>/shazam/i.test(p.name)),out=[];let i=0;
    const fresh=p=>{const c=C[p.id],tot=(p.items||p.tracks||{}).total;return c&&(p.snapshot_id?c.sid==p.snapshot_id:tot!=null&&tot==c.t.length)};
    const get=async(p,lb)=>{const o=mk1(p);
      if(fresh(p)){o.t=C[p.id].t;C[p.id].name=p.name}
      else{try{o.t=await plTracks(p.id,lb);C[p.id]={sid:p.snapshot_id,name:p.name,t:o.t}}catch(e){if(e.rl)throw e;o.err=e.message}}
      return fin(o)};
    await Promise.all([0,1].map(async()=>{while(i<reg.length){const p=reg[i++];out.push(await get(p));if(!quiet)msg(`טוען ${out.length}/${reg.length} · ${p.name}`)}}));
    S.pls=out;S.t0=Date.now();recalc();render();sv();
    for(const p of shz)S.pls.push(await get(p,'Shazam'));
    try{const h=await api('/me/tracks?limit=1'),c=C.liked;let t;
      if(c&&c.n==h.total)t=c.t;else{const lk=await pages('/me/tracks?limit=50','Liked Songs');t=lk.map(x=>x&&x.track).filter(t=>t&&t.id&&t.type!=='episode').map(mapT);C.liked={n:h.total,name:'❤ Liked Songs',t}}
      S.pls.push({id:'liked',name:'❤ Liked Songs',t,s:new Set(t.map(x=>x.id)),liked:true})}catch(e){if(e.rl)throw e;S.noLiked=e.message}
    recalc();S.t0=Date.now();
  }catch(e){sv();if(!S.pls.length){S.loading=0;return msg('שגיאה: '+e.message,1)}toast(e.message,1)}
  sv();S.loading=0;render();
}
function recalc(){
  const m=S.main=S.pls.filter(p=>!p.shz&&!p.liked);S.W={};S.info={};S.A={};
  S.pls.forEach(p=>p.t.forEach(t=>t.ar.forEach(n=>{const k=n.toLowerCase(),a=S.A[k]||(S.A[k]={n,t:{},c:0});if(!a.t[t.id]){a.t[t.id]=t;a.c++}})));
  m.forEach(p=>p.t.forEach(t=>{(S.W[t.id]=S.W[t.id]||new Set()).add(p);S.info[t.id]=t}));
  m.forEach(p=>{let ov=0,bn=0;p.best=null;p.t.forEach(t=>{if(S.W[t.id].size>1)ov++});
    m.forEach(q=>{if(q===p)return;let n=0;p.s.forEach(x=>{if(q.s.has(x))n++});if(n>bn){bn=n;p.best=q.name}});
    p.ovf=p.t.length?ov/p.t.length:0});
}
const BIG=/old ?school|אולד סקול|oldies|classics|קלאסיקה|favorites|הכל/i;
function health(p){
  const n=p.t.length,pc=Math.round(p.ovf*100),big=BIG.test(p.name)||S.kb[p.id];
  const s=Math.max(0,Math.round(100-(big?0:Math.min(60,Math.max(0,n-120)/6))-p.ovf*40-(n<10?20:0)));
  let r;
  if(!big&&n>200)r=`ארוך מדי · כדאי לפצל ל-${Math.ceil(n/120)} פלייליסטים`;
  else if(p.ovf>.4&&p.best)r=`הרבה כפילויות · כדאי לאחד עם "${p.best}"`;
  else if(p.ovf>.2)r=`${pc}% כפילויות · ראה לשונית כפילויות`;
  else if(n<15)r='קטן מאוד · כדאי לאחד עם פלייליסט דומה';
  else r=big&&n>200?'גדול בכוונה · בדוק מה לא משתלב':'תקין';
  return{s,r,big,c:s>=80?'#1ed760':s>=60?'#a3d95c':s>=40?'#ffb454':'#ff6b6b'};
}
/* ---------- playlist edits ---------- */
async function mk(name){
  const body=JSON.stringify({name,public:false,description:'Playlist Sorter'});let p;
  try{p=await api('/me/playlists',{method:'POST',body})}catch(e){const me=await api('/me');p=await api(`/users/${me.id}/playlists`,{method:'POST',body})}
  return{id:p.id,name,t:[],s:new Set(),shz:false};
}
async function add(p,t){const b=JSON.stringify({uris:['spotify:track:'+t.id]});
  try{await api(`/playlists/${p.id}/items`,{method:'POST',body:b})}catch(e){await api(`/playlists/${p.id}/tracks`,{method:'POST',body:b})}
  p.s.add(t.id);p.t.push(t)}
async function rem(p,t){const u='spotify:track:'+t.id;
  try{await api(`/playlists/${p.id}/items`,{method:'DELETE',body:JSON.stringify({items:[{uri:u}]})})}
  catch(e){await api(`/playlists/${p.id}/tracks`,{method:'DELETE',body:JSON.stringify({tracks:[{uri:u}]})})}
  p.s.delete(t.id);p.t=p.t.filter(x=>x.id!=t.id)}
async function rmFrom(tid,pid){
  const p=S.pls.find(x=>x.id==pid),t=S.info[tid];if(!p||!t||S.busy)return;
  if(!confirm(`להסיר את "${t.n}" מהפלייליסט "${p.name}"?`))return;
  S.busy=1;try{await rem(p,t);if(p.out)p.out=p.out.filter(x=>x.id!=tid);recalc();toast('הוסר ✓')}catch(e){toast('שגיאה: '+e.message,1)}S.busy=0;render();
}
async function tgl(pid){
  const p=S.pls.find(x=>x.id==pid),t=S.cur;if(!p||!t||S.busy)return;S.busy=1;
  try{const on=p.s.has(t.id);await(on?rem(p,t):add(p,t));recalc();toast(on?`הוסר מ-${p.name}`:`נוסף ל-${p.name} ✓`)}catch(e){toast('שגיאה: '+e.message,1)}
  S.busy=0;$('#pk').innerHTML=pickHTML();
}
async function newPl(){
  const v=$('#np').value.trim(),t=S.cur;if(!v||!t||S.busy)return;S.busy=1;
  try{const p=await mk(v);S.pls.push(p);await add(p,t);recalc();toast('נוצר ונוסף ✓')}catch(e){toast('שגיאה: '+e.message,1)}
  S.busy=0;$('#pk').innerHTML=pickHTML();
}

/* ---------- sorting (tinder) ---------- */
function source(){return S.pls.find(p=>p.id==S.src)||S.pls.find(p=>p.shz)||S.pls[0]}
function queue(){
  const src=source(),seen={};if(!src)return[];
  return src.t.filter(t=>{if(seen[t.id]||S.rej[t.id]||S.skp[t.id])return false;seen[t.id]=1;return !(S.only&&(src.shz||src.liked))||!S.W[t.id]});
}
const go=k=>{const t=S.cur;if(!t)return;if(k=='rej')S.rej[t.id]=1;else S.skp[t.id]=1;S.hist.push({t});S.cur=null;S.pick=false;save();render()};
const keep=()=>{S.pick=true;render()};
function done(){const t=S.cur;if(t&&!S.W[t.id]){S.skp[t.id]=1;S.hist.push({t})}S.cur=null;S.pick=false;save();render()}
function undo(){const h=S.hist.pop();if(!h)return;delete S.rej[h.t.id];delete S.skp[h.t.id];S.cur=h.t;S.pick=false;save();render()}
const pickHTML=()=>{const t=S.cur;return`<div class="mut">הוסף ל… (אפשר כמה)</div><div class="tags">${S.main.map(p=>`<button class="chip ${p.s.has(t.id)?'on':''}" onclick="tgl('${p.id}')">${esc(p.name)}<small>${p.t.length}</small></button>`).join('')}</div>
 <div class="fl"><input id="np" placeholder="פלייליסט חדש…"><button class="btn sm" onclick="newPl()">צור והוסף</button></div>`};
function viewSort(){
  const src=source(),q=queue();if(!S.cur)S.cur=q[0]||null;const t=S.cur;
  const sel=`<select onchange="S.src=this.value;S.cur=null;render()">${S.pls.map(p=>`<option value="${p.id}" ${src&&p.id==src.id?'selected':''}>${esc(p.name)} (${p.t.length})</option>`).join('')}</select>
   ${src&&(src.shz||src.liked)?`<label><input type="checkbox" ${S.only?'checked':''} onchange="S.only=this.checked;S.cur=null;render()">רק שירים שלא נמצאים באף פלייליסט</label>`:''}`;
  const head=`<div class="card"><div class="mut">מקור המיון · נותרו ${q.length}${src&&src.t.length?` מתוך ${src.t.length}`:''}</div>${sel}${src&&src.err?`<p class="mut" style="color:var(--w)">לא הצלחתי לקרוא את הפלייליסט הזה (שגיאה ${esc(src.err)}). ייתכן שספוטיפיי חוסמת גישה אליו. בחר פלייליסט אחר.</p>`:''}</div>`;
  if(!t)return head+'<div class="card" style="text-align:center">🎉 אין עוד שירים למיון במקור הזה</div>';
  const inn=[...(S.W[t.id]||[])].map(p=>esc(p.name)).join(' · ');
  return head+`<div class="card" id="sw"><div class="song">${esc(t.n)}</div><div class="art">${esc(t.a)}</div>
  <iframe src="https://open.spotify.com/embed/track/${t.id}" allow="encrypted-media"></iframe>
  ${inn?`<div class="mut" style="margin-top:8px">כבר נמצא ב: ${inn}</div>`:''}
  ${S.pick?`<div id="pk">${pickHTML()}</div><button class="btn yes" style="width:100%;margin:8px 0 0" onclick="done()">סיום · הבא ←</button>`
  :`<div class="act" style="margin-top:14px"><button class="btn no" onclick="go('rej')">✕ לא</button><button class="btn" onclick="go('skp')">דלג</button><button class="btn yes" onclick="keep()">♥ כן</button></div>
  <div class="mut" style="text-align:center;margin-top:10px">אפשר גם להחליק: ימינה = כן · שמאלה = לא</div>`}
  <div style="margin-top:8px"><button class="btn sm" onclick="undo()" ${S.hist.length?'':'disabled'}>↩ בטל</button></div></div>`;
}

/* ---------- other views ---------- */
const vibeHTML=p=>!p.vm?'':`<div class="mut" style="margin-top:8px">${esc(p.vm)}</div>`+(p.out||[]).slice(0,15).map(t=>`<div class="top" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(t.n)} <span class="mut">${esc(t.a)}</span></span><button class="chip sm" onclick="rmFrom('${t.id}','${p.id}')">הסר</button></div>`).join('')+((p.out||[]).length>15?`<div class="mut">ועוד ${p.out.length-15}…</div>`:'');
function kb(pid){S.kb[pid]=!S.kb[pid];LS.kb=JSON.stringify(S.kb);render()}
function viewOv(){
  const ids=Object.keys(S.W),multi=ids.filter(i=>S.W[i].size>1).length,sz=S.pls.find(p=>p.shz);
  const un=sz?Object.keys(sz.t.reduce((o,t)=>(o[t.id]=1,o),{})).filter(i=>!S.W[i]).length:0;
  const bad=S.pls.filter(p=>p.err&&!p.liked);
  const cards=S.main.map(p=>({p,h:health(p)})).sort((a,b)=>a.h.s-b.h.s).map(({p,h})=>
   `<div class="card"><div class="top"><b>${esc(p.name)}</b><span class="sc" style="background:${h.c}">${h.s}</span></div>
   <div class="mut">${p.t.length} שירים</div><div class="rec">${esc(h.r)}</div>
   <div class="tags" style="margin-bottom:0"><button class="chip sm" onclick="vibe('${p.id}')">🔍 מה לא משתלב?</button>${p.t.length>200&&!h.big?`<button class="chip sm" onclick="kb('${p.id}')">ארוך בכוונה</button>`:''}</div>${vibeHTML(p)}</div>`).join('');
  const code=LS.rt?btoa(JSON.stringify({c:LS.cid,r:LS.rt})):'';
  return `<div class="tiles"><div class="tile"><b>${ids.length}</b><span>שירים ייחודיים</span></div><div class="tile" onclick="S.tab='du';render()"><b>${multi}</b><span>ביותר מפלייליסט</span></div><div class="tile" onclick="S.tab='so';render()"><b>${un}</b><span>ב-Shazam לא ממוינים</span></div></div>
  ${sz&&sz.err?`<div class="card mut" style="color:var(--w)">פלייליסט ה-Shazam לא נקרא (שגיאה ${esc(sz.err)}). במסך המיון אפשר לבחור מקור אחר.</div>`:''}
  ${S.noLiked?`<div class="card mut" style="color:var(--w)">כדי לקרוא את Liked Songs צריך להתחבר מחדש עם הרשאה חדשה. <button class="btn sm" onclick="reset()">התחבר מחדש</button></div>`:''}
  ${bad.length?`<div class="card mut">לא נקראו: ${bad.map(p=>esc(p.name)).join(', ')}</div>`:''}
  <h2>ציון לכל פלייליסט · 100 = מסודר, נמוך = כדאי לטפל</h2>${cards}
  <details class="card"><summary>חיבור מכשיר נוסף (למשל האייפד הישן)</summary><p class="mut">העתק את הקוד והדבק אותו במסך החיבור של המכשיר השני. הקוד פרטי, אל תשתף אותו.</p>
  <textarea readonly id="cd" onclick="this.select()">${code}</textarea><p><button class="btn sm" onclick="cp()">העתק</button></p></details>`;
}
function cp(){const c=$('#cd');c.select();try{navigator.clipboard.writeText(c.value).then(()=>toast('הועתק ✓'))}catch(e){document.execCommand('copy');toast('הועתק ✓')}}
function viewDup(){
  let ids=Object.keys(S.W).filter(i=>S.W[i].size>1).sort((a,b)=>S.W[b].size-S.W[a].size);const d={};
  ids.forEach(i=>{const k=Math.min(5,S.W[i].size);d[k]=(d[k]||0)+1});
  const q=S.q.toLowerCase();if(q)ids=ids.filter(i=>(S.info[i].n+' '+S.info[i].a).toLowerCase().indexOf(q)>-1);
  const rows=ids.slice(0,S.dn).map(i=>{const t=S.info[i],ps=[...S.W[i]];return`<div class="card"><div class="top"><b>${esc(t.n)}</b><span class="mut">${ps.length}×</span></div><div class="mut">${esc(t.a)}</div>
   <div class="tags" style="margin-bottom:0">${ps.map(p=>`<button class="chip sm" onclick="rmFrom('${i}','${p.id}')">${esc(p.name)} ✕</button>`).join('')}</div></div>`}).join('');
  return `<div class="card"><b>${ids.length}</b> שירים בכמה פלייליסטים<div class="mut">ב-2: ${d[2]||0} · ב-3: ${d[3]||0} · ב-4: ${d[4]||0} · ב-5+: ${d[5]||0}</div>
  <div class="mut" style="margin-top:6px">לחיצה על שם פלייליסט מסירה ממנו את השיר (עם אישור).</div>
  <input placeholder="חיפוש שיר או אמן…" value="${esc(S.q)}" onchange="S.q=this.value;S.dn=40;render()" style="margin-top:10px"></div>${rows}
  ${ids.length>S.dn?`<button class="btn" style="width:100%;margin:0" onclick="S.dn+=40;render()">הצג עוד (${ids.length-S.dn})</button>`:''}`;
}
/* ---------- vibe check ---------- */
const RULES=[{re:/france|french|צרפת|פרנצ/i,k:['french','chanson','francoton','quebec','variet']},{re:/israel|hebrew|עברית|ישראל|מזרחי/i,k:['israeli','mizrahi','hebrew']},{re:/arab|ערבית/i,k:['arab','khaleeji','egypt','lebanese','rai']},{re:/spanish|latin|ספרדית|לטינ/i,k:['latin','spanish','reggaeton','mexican']}];
async function genres(ids){
  const need=[...new Set(ids)].filter(i=>i&&!(i in S.G));
  for(let i=0;i<need.length;i+=50){const c=need.slice(i,i+50),j=await api('/artists?ids='+c.join(','));c.forEach(x=>S.G[x]=[]);(j.artists||[]).forEach(a=>{if(a)S.G[a.id]=a.genres||[]})}
}
async function vibe(pid){
  const p=S.pls.find(x=>x.id==pid);if(!p||S.busy)return;S.busy=1;p.vm='בודק…';p.out=null;render();
  try{
    const nm=p.name.toLowerCase().trim(),A=S.A[nm];let out=[],vm;
    if(A&&A.c>=3){out=p.t.filter(t=>!t.ar.some(n=>n.toLowerCase()==nm));vm=out.length?`${out.length} שירים הם לא של ${A.n}`:`כל השירים של ${A.n} ✓`}
    else if(/old ?school|אולד סקול/i.test(p.name)){out=p.t.filter(t=>t.y>=2010);vm=out.length?`${out.length} שירים יצאו ב-2010 ומעלה`:'כל השירים ישנים ✓'}
    else{
      await genres(p.t.reduce((a,t)=>a.concat(t.ai),[]));
      const g=t=>[].concat(...t.ai.map(i=>S.G[i]||[])),cov=p.t.filter(t=>g(t).length),rule=RULES.find(r=>r.re.test(p.name));
      if(cov.length<10)vm='ספוטיפיי לא מחזירה מספיק מידע על ז׳אנרים לפלייליסט הזה';
      else if(rule){out=cov.filter(t=>!g(t).some(x=>rule.k.some(k=>x.indexOf(k)>-1)));vm=out.length?`${out.length} שירים לא נראים כמו "${p.name}"`:'הכול מתאים ✓'}
      else{const c={};cov.forEach(t=>new Set(g(t).join(' ').split(' ')).forEach(w=>{if(w.length>2&&w!='music')c[w]=(c[w]||0)+1}));
        const top=Object.keys(c).filter(w=>c[w]>=cov.length*.15).sort((a,b)=>c[b]-c[a]).slice(0,6);
        out=cov.filter(t=>!g(t).join(' ').split(' ').some(w=>top.indexOf(w)>-1));
        vm=out.length?`הווייב: ${top.slice(0,3).join(', ')} · ${out.length} שירים חורגים`:'הכול מתאים ✓'}
    }
    p.out=out;p.vm=vm;
  }catch(e){p.vm='לא הצלחתי לבדוק: '+e.message}
  S.busy=0;render();
}
/* ---------- artists ---------- */
async function addMany(p,ts){for(let i=0;i<ts.length;i+=100){const c=ts.slice(i,i+100),b=JSON.stringify({uris:c.map(t=>'spotify:track:'+t.id)});
  try{await api(`/playlists/${p.id}/items`,{method:'POST',body:b})}catch(e){await api(`/playlists/${p.id}/tracks`,{method:'POST',body:b})}
  c.forEach(t=>{p.s.add(t.id);p.t.push(t)})}}
async function remMany(p,ts){for(let i=0;i<ts.length;i+=100){const c=ts.slice(i,i+100);
  try{await api(`/playlists/${p.id}/items`,{method:'DELETE',body:JSON.stringify({items:c.map(t=>({uri:'spotify:track:'+t.id}))})})}
  catch(e){await api(`/playlists/${p.id}/tracks`,{method:'DELETE',body:JSON.stringify({tracks:c.map(t=>({uri:'spotify:track:'+t.id}))})})}
  c.forEach(t=>p.s.delete(t.id))}p.t=p.t.filter(t=>p.s.has(t.id))}
async function collect(){
  const a=S.A[S.art];if(!a||S.busy)return;const name=$('#an').value.trim()||a.n,mv=$('#mv').checked,ts=Object.values(a.t);
  let p=S.main.find(x=>x.name==name);const others=mv?S.main.filter(x=>x!==p&&ts.some(t=>x.s.has(t.id))):[];
  if(!confirm(`לאסוף ${ts.length} שירים של ${a.n} לפלייליסט "${name}"`+(mv?` ולהסיר אותם מ-${others.length} פלייליסטים אחרים`:'')+'?'))return;
  S.busy=1;
  try{if(!p){p=await mk(name);S.pls.push(p)}
    await addMany(p,ts.filter(t=>!p.s.has(t.id)));let fail=0;
    for(const o of others){try{await remMany(o,ts.filter(t=>o.s.has(t.id)))}catch(e){fail++}}
    recalc();toast(fail?`נאסף. ${fail} פלייליסטים לא ניתנים לעריכה`:'נאסף ✓')}
  catch(e){toast('שגיאה: '+e.message,1)}
  S.busy=0;render();
}
async function addMiss(pid){
  const p=S.pls.find(x=>x.id==pid),a=p&&S.A[p.name.toLowerCase().trim()];if(!a||S.busy)return;
  const m=Object.values(a.t).filter(t=>!p.s.has(t.id));if(!confirm(`להוסיף ${m.length} שירים של ${a.n} ל"${p.name}"?`))return;
  S.busy=1;try{await addMany(p,m);recalc();toast('נוסף ✓')}catch(e){toast('שגיאה: '+e.message,1)}S.busy=0;render();
}
const pickArt=k=>`S.art=decodeURIComponent('${encodeURIComponent(k)}');render()`;
function viewArt(){
  const miss=[];S.main.forEach(p=>{const k=p.name.toLowerCase().trim(),a=S.A[k];if(a&&a.c>=3){const m=Object.keys(a.t).filter(i=>!p.s.has(i));if(m.length)miss.push({p,k,m})}});
  const mh=miss.length&&!S.art?`<h2>פלייליסטי אמן שחסרים בהם שירים</h2>`+miss.map(x=>`<div class="card"><div class="top"><b>${esc(x.p.name)}</b><span class="mut">חסרים ${x.m.length}</span></div><div class="tags" style="margin-bottom:0"><button class="chip sm" onclick="addMiss('${x.p.id}')">הוסף את כולם</button><button class="chip sm" onclick="${pickArt(x.k)}">איפה הם?</button></div></div>`).join(''):'';
  const q=S.aq.toLowerCase().trim(),ms=q?Object.keys(S.A).filter(k=>k.indexOf(q)>-1).sort((a,b)=>S.A[b].c-S.A[a].c).slice(0,12):[];
  const head=`<div class="card"><input placeholder="חפש אמן…" value="${esc(S.aq)}" onchange="S.aq=this.value;S.art='';render()">
   <div class="tags">${ms.map(k=>`<button class="chip ${k==S.art?'on':''}" onclick="${pickArt(k)}">${esc(S.A[k].n)}<small>${S.A[k].c}</small></button>`).join('')}</div>${q&&!ms.length?'<div class="mut">לא נמצא אמן כזה</div>':''}</div>`;
  const a=S.A[S.art];if(!a)return head+mh;
  const ts=Object.values(a.t),loc=t=>S.pls.filter(p=>p.s.has(t.id)),sp={};ts.forEach(t=>loc(t).forEach(p=>{if(!p.shz&&!p.liked)sp[p.id]=1}));
  const home=S.main.find(p=>p.name.toLowerCase().trim()==S.art);
  return head+`<div class="card"><b>${ts.length} שירים · פזורים ב-${Object.keys(sp).length} פלייליסטים</b>
   <div class="fl"><input id="an" value="${esc(home?home.name:a.n)}"></div>
   <label><input type="checkbox" id="mv">גם להסיר מכל הפלייליסטים האחרים (העברה)</label>
   <button class="btn yes" style="width:100%;margin:10px 0 0" onclick="collect()">אסוף לפלייליסט</button>
   <div class="mut" style="margin-top:8px">אם קיים פלייליסט בשם הזה, השירים יתווספו אליו. אחרת ייווצר חדש. לפלייליסט נפרד, שנה את השם.</div></div>`
   +ts.slice(0,120).map(t=>`<div class="card"><b>${esc(t.n)}</b><div class="mut">${esc(t.a)}</div><div class="rec">${loc(t).map(p=>esc(p.name)).join(' · ')||'לא נמצא בשום מקום'}</div></div>`).join('');
}
function render(){
  const y=scrollY,v={ov:viewOv,ar:viewArt,du:viewDup,so:viewSort}[S.tab]();
  const tm=S.t0?new Date(S.t0).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'';
  $('#app').innerHTML=`<header><div><h1>🎧 Playlist Sorter</h1><span class="mut">${S.main.length} פלייליסטים · עודכן ${tm}</span></div><button class="btn sm" onclick="load(true)">↻ רענן</button></header>${S.loading?`<div class="card mut" id="prog">${esc(S.prog||'טוען ברקע…')}</div>`:''}
  <div class="tabs">${[['ov','סקירה'],['ar','אמנים'],['du','כפילויות'],['so','מיון']].map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${n}</button>`).join('')}</div>${v}`;
  const c=$('#sw');if(c&&!S.pick){let x=0;c.ontouchstart=e=>{x=e.touches[0].clientX};c.ontouchend=e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>100)d>0?keep():go('rej')}}
  scrollTo(0,y);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.t0&&!S.busy&&!S.loading&&Date.now()-S.t0>180000)load(true)});

/* ---------- start ---------- */
(async()=>{
  const code=new URLSearchParams(location.search).get('code');
  try{
    if(code){msg('מתחבר…');await tokReq({client_id:LS.cid,grant_type:'authorization_code',code,redirect_uri:REDIR,code_verifier:LS.ver});history.replaceState({},'',REDIR);await load()}
    else if(LS.rt||LS.tok){msg('טוען…');await load()}
    else $('#app').innerHTML=`<header><h1>🎧 Playlist Sorter</h1></header><div class="card"><b>חיבור לספוטיפיי</b>
     <p class="mut">ב-developer.spotify.com/dashboard צור אפליקציה עם Redirect URI:<br><code>${esc(REDIR)}</code></p>
     <input id="cid" placeholder="Client ID" value="${esc(LS.cid||'')}" style="direction:ltr"><p><button class="btn yes" style="width:100%;margin:0" onclick="login()">התחבר</button></p></div>
     <div class="card"><b>יש לך קוד חיבור ממכשיר אחר?</b><p class="mut">מתאים למכשירים ישנים שלא מצליחים להתחבר לספוטיפיי.</p><textarea id="cc" placeholder="הדבק כאן"></textarea><p><button class="btn" style="width:100%;margin:0" onclick="useCode()">חבר</button></p></div>`;
  }catch(e){msg('שגיאה: '+e.message,1)}
})();
</script></body></html>
